name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write      # keyless cosign signatures
  attestations: write  # SLSA build provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/app/pnpm-lock.yaml
      # Fail here, before anything is published, when the key is not reaching
      # the runner: a release nobody can verify is worse than no release.
      - name: Signing key present
        env:
          ISLET_SIGNING_KEY: ${{ secrets.ISLET_SIGNING_KEY }}
        run: |
          if [ -z "${ISLET_SIGNING_KEY:-}" ]; then
            echo "::error::The ISLET_SIGNING_KEY secret is empty or not visible to this repository. Check Settings, Secrets and variables, Actions: it must be listed there (an organization secret needs this repository in its access list) and spelled exactly ISLET_SIGNING_KEY."
            exit 1
          fi
          # Whitespace around the value is harmless: the signing tool trims it.
          key="$(printf '%s' "$ISLET_SIGNING_KEY" | tr -d '[:space:]')"
          case "$key" in
            *[!0-9a-fA-F]*) echo "::error::ISLET_SIGNING_KEY is not hexadecimal; paste the single line from ~/.islet/release-signing.key."; exit 1 ;;
          esac
          if [ "${#key}" -ne 128 ]; then
            echo "::error::ISLET_SIGNING_KEY holds ${#key} hex characters; the Ed25519 private key is 128."
            exit 1
          fi
          echo "signing key present: 128 hex characters"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ed25519 release signing key, hex; generated with `go run ./tools/sign keygen`.
          ISLET_SIGNING_KEY: ${{ secrets.ISLET_SIGNING_KEY }}
      # Second, independent signature: keyless cosign (Sigstore) over the
      # checksums file, verifiable without any Islet key.
      - uses: sigstore/cosign-installer@v3
      - name: Sign checksums with cosign
        run: |
          cosign sign-blob --yes --bundle dist/checksums.txt.cosign.bundle dist/checksums.txt
          gh release upload "${GITHUB_REF_NAME}" dist/checksums.txt.cosign.bundle --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # SLSA build provenance for the archives, attached to the repository.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt
