name: docs

# The documentation is published at islet.dev/docs, by the website repository:
# its deploy workflow checks this repository out, runs tools/docsite, and ships
# the result with the site. Nothing here pushes anything.
#
# This job renders the site to prove the sources still render — a broken link or
# a page that will not build should fail here, on the repository that owns the
# text, rather than in a deploy somewhere else. It also keeps the GitHub Pages
# path available: set the repository variable DOCS_SITE=true and enable Pages to
# publish a second copy.

on:
  push:
    branches: [main]
    paths: ["docs/**", "README.md", "SECURITY.md", "CONTRIBUTING.md", "TRADEMARK.md", "catalog/README.md", "examples/README.md", "tools/docsite/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: vars.DOCS_SITE == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run ./tools/docsite -out site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: vars.DOCS_SITE == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
