name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Called by the release workflow, which must not publish untested code.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/app/pnpm-lock.yaml
      - name: Web app
        working-directory: web/app
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Embed UI
        run: rm -rf internal/web/dist && cp -r web/app/dist internal/web/dist
      - name: Go
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt"; exit 1; }
          go vet ./...
          go test ./...
      # The Go splitter and the editor's own have to give the same answer, or
      # the editor outlines one statement and the server runs another. Both
      # read internal/sqlclient/testdata/statements.json; this runs them over
      # it. Node strips the types, so there is no build step and no framework.
      - name: SQL splitters agree
        run: node --experimental-strip-types hack/sql-split-agree.mjs

      # A single static binary means the dependencies ship inside it, so a
      # vulnerability in one of them is a vulnerability in Islet and there is
      # no distribution package to fix it underneath us. govulncheck reports
      # only what is actually reachable from this code, so the answer is
      # usually nothing and a finding is worth reading.
      - name: Known vulnerabilities
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Docs site renders
        run: go run ./tools/docsite -out /tmp/site && test -f /tmp/site/index.html
      - name: Cross-compile
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/isletd
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/isletd
      - name: Installer syntax
        run: for f in installer/*.sh hack/*.sh; do sh -n "$f" || exit 1; done

  # The end-to-end suites, which until now existed and were run by hand — so
  # nothing caught the change that broke one. These two need a daemon and
  # nothing else: no cloud account, no API key, no second machine. The runner
  # already has Docker, which is what backups use.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build the daemon
        run: go build -o /tmp/isletd ./cmd/isletd
      - name: Start it on a scratch data directory
        run: |
          mkdir -p /tmp/isletdata
          ISLET_DATA_DIR=/tmp/isletdata ISLET_LISTEN=127.0.0.1:9443 ISLET_TLS=off             /tmp/isletd > /tmp/isletd.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:9443/api/v1/health > /dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:9443/api/v1/health || { cat /tmp/isletd.log; exit 1; }
      - name: Create the first admin
        run: |
          TOKEN=$(cat /tmp/isletdata/setup-token)
          curl -sS -X POST http://127.0.0.1:9443/api/v1/setup \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"ci-admin\",\"password\":\"ci-only-password-123\",\"token\":\"$TOKEN\"}" \
            -D /tmp/setup.headers -o /dev/null
          sed -n 's/.*islet_session=\([^;]*\).*/\1/p' /tmp/setup.headers | head -1 > /tmp/cookie
          test -s /tmp/cookie
      - name: Privileges
        run: python3 hack/e2e-privileges.py "$(cat /tmp/cookie)"
      - name: A backup that restores
        run: ISLET_BASE=http://127.0.0.1:9443 sh hack/e2e-backup.sh "$(cat /tmp/cookie)"
      - name: The daemon logged no panics
        if: always()
        run: |
          ! grep -q "panic" /tmp/isletd.log || { cat /tmp/isletd.log; exit 1; }
