name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Called by the release workflow, which must not publish untested code.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/app/pnpm-lock.yaml
      - name: Web app
        working-directory: web/app
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Embed UI
        run: rm -rf internal/web/dist && cp -r web/app/dist internal/web/dist
      - name: Go
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt"; exit 1; }
          go vet ./...
          go test ./...
      - name: Docs site renders
        run: go run ./tools/docsite -out /tmp/site && test -f /tmp/site/index.html
      - name: Cross-compile
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/isletd
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/isletd
      - name: Installer syntax
        run: for f in installer/*.sh hack/*.sh; do sh -n "$f" || exit 1; done
