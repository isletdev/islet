services:
  pocket-id:
    image: pocketid/pocket-id:v2
    restart: unless-stopped
    environment:
      # Pocket ID builds its OIDC issuer and passkey origin from this, and a
      # passkey is bound to the origin it was created on: get this wrong and
      # credentials enrol against a name that will not work later.
      APP_URL: https://${ISLET_DOMAIN}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # The way back in when no administrator exists. Pocket ID treats this key
      # as an admin account of its own ("Static API User"), created the first
      # time the key is used and deleted again if it is ever unset — so the
      # promote-a-user call below works even though nobody can sign in to do it.
      STATIC_API_KEY: ${STATIC_API_KEY}
      # disabled | withToken | open. Pocket ID's own default is disabled: an
      # admin creates every account.
      ALLOW_USER_SIGNUPS: ${ALLOW_USER_SIGNUPS}
      APP_NAME: ${APP_NAME}
      # It sits behind Islet's proxy, so the client address arrives in a header
      # rather than on the connection. Without this every sign-in looks like it
      # came from the proxy.
      TRUST_PROXY: "true"
    volumes:
      - data:/app/data
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 90s
      timeout: 5s
      retries: 2
      start_period: 10s
volumes:
  data:
