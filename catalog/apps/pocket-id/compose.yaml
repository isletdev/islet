services:
  pocket-id:
    image: pocketid/pocket-id:v2
    restart: unless-stopped
    environment:
      # Pocket ID builds its OIDC issuer and passkey origin from this, and a
      # passkey is bound to the origin it was created on: get this wrong and
      # credentials enrol against a name that will not work later.
      APP_URL: https://${ISLET_DOMAIN}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # It sits behind Islet's proxy, so the client address arrives in a header
      # rather than on the connection. Without this every sign-in looks like it
      # came from the proxy.
      TRUST_PROXY: "true"
    volumes:
      - data:/app/data
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 90s
      timeout: 5s
      retries: 2
      start_period: 10s
volumes:
  data:
