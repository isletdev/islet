services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # start, not start-dev: the development mode disables the hostname checks
    # and the production defaults, and a server people sign into deserves the
    # real ones. --http-enabled because TLS ends at Islet's proxy.
    command: ["start", "--http-enabled=true", "--proxy-headers=xforwarded"]
    environment:
      # The one hostname everything is built from: the issuer, every redirect,
      # and the links in the emails it sends. Get it wrong and clients trust an
      # issuer that does not answer.
      KC_HOSTNAME: https://${ISLET_DOMAIN}
      # Created once, on the first start with an empty database, and ignored
      # afterwards. Change the password in the console; it is here so nobody
      # has to hunt for a printed default.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KC_HEALTH_ENABLED: "true"
    healthcheck:
      # Keycloak's own health endpoint, on the management port rather than the
      # public one, which is where it has lived since version 25.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\nHost: localhost\\nConnection: close\\n\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    user: postgres
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: keycloak
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  db:
