services:
  plausible:
    image: ghcr.io/plausible/community-edition:v3
    restart: unless-stopped
    command: sh -c "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    depends_on: [db, events]
    environment:
      BASE_URL: https://${ISLET_DOMAIN}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      TOTP_VAULT_KEY: ${TOTP_VAULT_KEY}
      DATABASE_URL: postgres://postgres:${DB_PASSWORD}@db:5432/plausible_db
      CLICKHOUSE_DATABASE_URL: http://events:8123/plausible_events_db
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: plausible_db
    volumes:
      - db:/var/lib/postgresql/data
  events:
    image: clickhouse/clickhouse-server:24.12-alpine
    restart: unless-stopped
    volumes:
      - events:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
volumes:
  db:
  events:
