version: 2
project_name: islet

before:
  hooks:
    - sh -c "cd web/app && pnpm install --frozen-lockfile && pnpm build"
    - sh -c "rm -rf internal/web/dist && cp -r web/app/dist internal/web/dist"

builds:
  - id: isletd
    main: ./cmd/isletd
    binary: isletd
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -buildid=
      - -X github.com/isletdev/islet/internal/version.Version={{ .Version }}
      - -X github.com/isletdev/islet/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/isletdev/islet/internal/version.Date={{ .Date }}

archives:
  - id: isletd
    ids: [isletd]
    formats: [tar.gz]
    # The installer downloads isletd_linux_<arch>.tar.gz and creates the islet symlink.
    name_template: "isletd_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - deploy/systemd/isletd.service

checksum:
  name_template: checksums.txt
  algorithm: sha256

signs:
  - id: checksums
    artifacts: checksum
    cmd: go
    args: ["run", "./tools/sign", "sign", "-", "${artifact}"]
    signature: "${artifact}.sig"
    # The tool reads ISLET_SIGNING_KEY from the environment goreleaser passes
    # through. Templating it here would abort the release with a confusing
    # "map has no entry" when the secret is missing; the guard step in the
    # workflow says what is wrong instead.

release:
  github:
    owner: isletdev
    name: islet
  prerelease: auto
  draft: false

changelog:
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: '^feat'
    - title: Fixes
      regexp: '^fix'
    - title: Security
      regexp: '^security'
    - title: Other
      order: 999
  filters:
    exclude: ['^docs', '^chore', '^ci', '^test']
