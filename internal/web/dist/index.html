<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Islet</title>
<style>
  :root { color-scheme: light dark; --bg: #FFFFFF; --ink: #0A0A0A; --muted: #6B6B6B; --border: #E5E5E5; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0A0A0A; --ink: #FAFAFA; --muted: #A3A3A3; --border: #262626; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: grid; place-items: center; min-height: 100vh; }
  main { max-width: 32rem; padding: 2rem; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 1.25rem; }
  .logo svg { width: 24px; height: 24px; }
  h1 { font-size: 1.5rem; margin: 1.5rem 0 0.5rem; letter-spacing: -0.02em; }
  p { color: var(--muted); margin: 0; }
  code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.875em; }
  .row { margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border); font-size: 0.875rem; }
</style>
</head>
<body>
<main>
  <div class="logo"><svg viewBox="0 0 100 100" aria-hidden="true"><g fill="currentColor"><path d="M4 22 H50 V50 H78 V96 H4 Z"/><rect x="62" y="6" width="34" height="34"/></g></svg>Islet</div>
  <h1>The daemon is running.</h1>
  <p>The web app has not been built into this binary yet. The API answers at <code>/api/v1/health</code>.</p>
  <div class="row" id="status">Checking…</div>
</main>
<script>
  fetch("/api/v1/health").then(r => r.json()).then(h => {
    document.getElementById("status").textContent = "isletd " + h.version + " on " + h.hostname + ", up " + h.uptimeSeconds + "s";
  }).catch(() => { document.getElementById("status").textContent = "API not reachable."; });
</script>
</body>
</html>
